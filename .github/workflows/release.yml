name: Release HashiNet
# Every push to main ships, for as long as HashiNet is in development. To make releases manual
# again, replace `push` with `workflow_dispatch`. Deploying starts when DEPLOY_ENABLED is true.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hashinet-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  image:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.inputs.outputs.api }}
      web: ${{ steps.inputs.outputs.web }}
      tunnel: ${{ steps.inputs.outputs.tunnel }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "api=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
          echo "tunnel=ghcr.io/${REPOSITORY,,}/tunnel" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.api }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.web }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: tunnel
        with:
          context: .
          file: apps/tunnel/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.tunnel }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable release inputs
        id: inputs
        env:
          API_IMAGE: ${{ steps.name.outputs.api }}:${{ github.sha }}@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.name.outputs.web }}:${{ github.sha }}@${{ steps.web.outputs.digest }}
          TUNNEL_IMAGE: ${{ steps.name.outputs.tunnel }}:${{ github.sha }}@${{ steps.tunnel.outputs.digest }}
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nTUNNEL_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$TUNNEL_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'api=%s\nweb=%s\ntunnel=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$TUNNEL_IMAGE" >> "$GITHUB_OUTPUT"
  release:
    # Nothing here can deploy: this job records the release, and the deploy agent on hs (infra,
    # retire-Dokploy M3) migrates, then applies the latest release; its verdict goes to Kuma.
    # Rolling back is marking an earlier release as latest (`gh release edit <tag> --latest`).
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hashikome/actions/github-release@a467efcf2cd3a8568642844a58bc65b376d5e156
        with:
          images: |
            API_IMAGE=${{ needs.image.outputs.api }}
            WEB_IMAGE=${{ needs.image.outputs.web }}
            TUNNEL_IMAGE=${{ needs.image.outputs.tunnel }}
          github-token: ${{ github.token }}
